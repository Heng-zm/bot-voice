<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bot Voice - Advanced Architecture Flow</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0f172a;
      --dot-color: rgba(148, 163, 184, 0.15);
      --node-bg: #1e293b;
      --node-border: #334155;
      --node-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5), 0 2px 4px -1px rgba(0, 0, 0, 0.3);
      --node-hover: 0 0 0 2px #38bdf8, 0 10px 15px -3px rgba(0,0,0,0.5);
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
    }
    body, html {
      margin: 0; padding: 0; width: 100vw; height: 100vh;
      font-family: 'Inter', -apple-system, sans-serif;
      overflow: hidden;
      background-color: var(--bg-color);
      background-image: radial-gradient(var(--dot-color) 1px, transparent 1px);
      background-size: 24px 24px;
    }
    #canvas {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 1;
    }
    #container {
      position: absolute; top: 0; left: 0; width: 3500px; height: 2000px;
      transform-origin: 0 0; transition: transform 0.1s ease-out;
    }
    .node {
      position: absolute;
      background: var(--node-bg);
      border: 1px solid var(--node-border);
      border-radius: 12px;
      padding: 16px;
      box-shadow: var(--node-shadow);
      min-width: 240px;
      z-index: 2;
      cursor: grab;
      user-select: none;
      transition: box-shadow 0.2s, transform 0.2s, border-color 0.2s;
      backdrop-filter: blur(8px);
    }
    .node:hover {
      box-shadow: var(--node-hover);
      transform: translateY(-2px);
      z-index: 50;
    }
    .node:active { cursor: grabbing; transform: scale(0.98); }
    .node-header { 
      display: flex; align-items: center; margin-bottom: 8px; 
      font-weight: 600; color: var(--text-main); font-size: 15px; 
    }
    .node-icon { 
      margin-right: 12px; font-size: 20px; 
      background: rgba(255,255,255,0.05); padding: 6px; border-radius: 8px;
    }
    .node-desc { font-size: 13px; color: var(--text-sub); line-height: 1.5; font-weight: 400; }
    
    .handle {
      position: absolute; width: 12px; height: 12px;
      background: var(--bg-color); border: 2px solid #cbd5e1; border-radius: 50%;
      top: 50%; transform: translateY(-50%);
      transition: all 0.2s;
    }
    .handle-left { left: -7px; }
    .handle-right { right: -7px; }

    /* Luminous colors */
    .node[data-cat="trigger"] .handle-right { border-color: #f43f5e; box-shadow: 0 0 10px #f43f5e88; }
    .node[data-cat="gateway"] .handle { border-color: #f59e0b; box-shadow: 0 0 10px #f59e0b88;}
    .node[data-cat="core"] .handle { border-color: #3b82f6; box-shadow: 0 0 10px #3b82f688;}
    .node[data-cat="feature"] .handle { border-color: #0ea5e9; box-shadow: 0 0 10px #0ea5e988;}
    .node[data-cat="ai"] .handle { border-color: #8b5cf6; box-shadow: 0 0 10px #8b5cf688;}
    .node[data-cat="db"] .handle { border-color: #94a3b8; }
    .node[data-cat="output"] .handle-left { border-color: #10b981; box-shadow: 0 0 10px #10b98188;}

    .controls {
      position: fixed; bottom: 30px; right: 30px; z-index: 100;
      background: rgba(30, 41, 59, 0.8); padding: 10px; border-radius: 12px; 
      box-shadow: var(--node-shadow); display: flex; gap: 10px; border: 1px solid var(--node-border);
      backdrop-filter: blur(10px);
    }
    .controls button {
      background: #334155; border: none; border-radius: 6px; padding: 8px 16px;
      cursor: pointer; font-weight: 500; color: #f8fafc; font-family: 'Inter'; transition: all 0.2s;
    }
    .controls button:hover { background: #475569; }

    .topbar {
      position: fixed; top: 30px; left: 30px; background: rgba(30, 41, 59, 0.8); padding: 16px 24px;
      border-radius: 12px; box-shadow: var(--node-shadow); z-index: 100;
      font-weight: 600; color: #f8fafc; border: 1px solid var(--node-border); backdrop-filter: blur(10px);
      display: flex; align-items: center; gap: 16px; font-size: 16px;
    }
    
    .badge {
      background: #3b82f6; color: white; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold;
    }
    
    .path-line {
      transition: stroke-width 0.2s, stroke 0.2s;
    }
  </style>
</head>
<body>
  <div class="topbar">
    <span>Bot Voice V2.0</span>
    <span class="badge">Live Architecture Map</span>
  </div>
  
  <div class="controls">
    <button onclick="setZoom(zoom + 0.1)">Zoom In</button>
    <button onclick="setZoom(zoom - 0.1)">Zoom Out</button>
    <button onclick="setZoom(1); panX=0; panY=0; updateTransform();">Reset View</button>
  </div>
  
  <div id="container">
    <svg id="canvas"></svg>
  </div>

  <script>
    const nodesData = [
      { id: 'user', cat: 'trigger', x: 50, y: 380, icon: '📱', label: 'Telegram App', desc: 'User sends text, link, or media' },
      { id: 'cron', cat: 'trigger', x: 50, y: 150, icon: '⏰', label: 'Background Cron', desc: 'Hourly Scheduler (07:00 AM)' },
      
      { id: 'webhook', cat: 'gateway', x: 400, y: 380, icon: '⚡', label: 'FastAPI Dispatcher', desc: 'Webhook, HMAC Auth & <5ms 200 OK' },
      
      { id: 'dedupe', cat: 'core', x: 750, y: 310, icon: '🔒', label: 'Queue & Chat Lock', desc: '32x Semaphore + FIFO ordering' },
      { id: 'cdn', cat: 'core', x: 750, y: 500, icon: '🚀', label: 'CDN Fast-Path', desc: '< 50ms voice delivery on cache hit' },
      
      { id: 'podcast', cat: 'feature', x: 1100, y: 100, icon: '📰', label: 'Morning Podcast', desc: 'Weather & News Aggregator' },
      { id: 'media', cat: 'feature', x: 1100, y: 220, icon: '📹', label: 'Media Downloader', desc: 'Zero-OOM FB/IG/TikTok Download' },
      { id: 'ocr', cat: 'feature', x: 1100, y: 340, icon: '🔍', label: 'Vision OCR Engine', desc: 'Extracts text from images' },
      { id: 'tempmail', cat: 'feature', x: 1100, y: 460, icon: '📧', label: 'Temp Mail Service', desc: 'Generates 15-min disposable emails' },
      { id: 'ai_chat', cat: 'feature', x: 1100, y: 580, icon: '🧠', label: 'AI Chatbot', desc: 'Handles /ask and general chat' },
      { id: 'bakong', cat: 'feature', x: 1100, y: 700, icon: '☕', label: 'Donation KHQR', desc: 'Bakong Payment Integration' },
      { id: 'admin', cat: 'feature', x: 1100, y: 820, icon: '⚙️', label: 'Settings & Admin', desc: 'User Preferences & Dashboards' },
      
      { id: 'qwen', cat: 'ai', x: 1500, y: 150, icon: '🤖', label: 'Qwen 2.5 AI', desc: 'Generates English executive summaries' },
      { id: 'gemini', cat: 'ai', x: 1500, y: 580, icon: '✨', label: 'Gemini 2.0 Flash', desc: 'Multimodal Vision & Fallback AI' },
      { id: 'translator', cat: 'ai', x: 1500, y: 360, icon: '🌐', label: 'Native Translator', desc: 'Accurate English -> Khmer localization' },
      
      { id: 'tts_edge', cat: 'ai', x: 1900, y: 300, icon: '🗣️', label: 'Edge Neural TTS', desc: 'Multilingual Voices (Fast & Stable)' },
      
      { id: 'supabase', cat: 'db', x: 2300, y: 660, icon: '🐘', label: 'Supabase DB', desc: 'PostgreSQL storage & PostgREST' },
      { id: 'redis', cat: 'db', x: 2300, y: 520, icon: '💾', label: 'Cache Memory', desc: 'Deduplication & CDN SingleFlight' },
      { id: 'migration', cat: 'db', x: 2300, y: 800, icon: '🔄', label: 'Migration CLI', desc: 'Zero-Downtime Topological sync' },
      
      { id: 'tg_api', cat: 'output', x: 2300, y: 320, icon: '📤', label: 'Telegram API', desc: 'Dispatches Audio, Video, & UI Cards' },
      { id: 'sse_logs', cat: 'output', x: 2300, y: 120, icon: '📊', label: 'SSE Log Stream', desc: 'Real-time telemetry dashboard' }
    ];

    const edgesData = [
      { from: 'user', to: 'webhook', color: '#f43f5e', animated: true },
      { from: 'cron', to: 'podcast', color: '#f43f5e', animated: true },
      
      { from: 'webhook', to: 'dedupe', color: '#f59e0b', animated: true },
      { from: 'dedupe', to: 'cdn', color: '#3b82f6', animated: true },
      { from: 'cdn', to: 'tg_api', color: '#10b981', animated: true, width: 4 },
      
      { from: 'dedupe', to: 'media', color: '#3b82f6', animated: true },
      { from: 'dedupe', to: 'ocr', color: '#3b82f6', animated: true },
      { from: 'dedupe', to: 'tempmail', color: '#3b82f6', animated: true },
      { from: 'dedupe', to: 'ai_chat', color: '#3b82f6', animated: true },
      { from: 'dedupe', to: 'bakong', color: '#3b82f6', animated: true },
      { from: 'dedupe', to: 'admin', color: '#3b82f6', animated: true },
      
      { from: 'podcast', to: 'qwen', color: '#0ea5e9', animated: true },
      { from: 'media', to: 'qwen', color: '#0ea5e9', animated: true },
      { from: 'ocr', to: 'gemini', color: '#0ea5e9', animated: true },
      { from: 'ai_chat', to: 'gemini', color: '#0ea5e9', animated: true },
      
      { from: 'qwen', to: 'translator', color: '#8b5cf6', animated: true, width: 4 },
      { from: 'gemini', to: 'translator', color: '#8b5cf6', animated: true },
      
      { from: 'translator', to: 'tts_edge', color: '#8b5cf6', animated: true },
      { from: 'podcast', to: 'tts_edge', color: '#0ea5e9', animated: true },
      { from: 'tempmail', to: 'tg_api', color: '#8b5cf6', animated: true },
      
      { from: 'tts_edge', to: 'tg_api', color: '#8b5cf6', animated: true },
      { from: 'podcast', to: 'tg_api', color: '#0ea5e9', animated: true },
      { from: 'media', to: 'tg_api', color: '#0ea5e9', animated: true },
      
      { from: 'admin', to: 'supabase', color: '#475569' },
      { from: 'migration', to: 'supabase', color: '#475569' },
      { from: 'bakong', to: 'supabase', color: '#475569' },
      { from: 'webhook', to: 'sse_logs', color: '#f59e0b', animated: true },
      { from: 'cdn', to: 'redis', color: '#3b82f6' },
      { from: 'dedupe', to: 'redis', color: '#3b82f6' },
      { from: 'tts_edge', to: 'redis', color: '#8b5cf6' }
    ];

    const container = document.getElementById('container');
    const canvas = document.getElementById('canvas');
    const nodes = {};
    const svgPaths = [];

    nodesData.forEach(data => {
      const el = document.createElement('div');
      el.className = 'node';
      el.id = data.id;
      el.setAttribute('data-cat', data.cat);
      el.style.left = data.x + 'px';
      el.style.top = data.y + 'px';
      
      el.innerHTML = `
        ${data.cat !== 'trigger' ? '<div class="handle handle-left"></div>' : ''}
        <div class="node-header">
          <span class="node-icon">${data.icon}</span>
          ${data.label}
        </div>
        <div class="node-desc">${data.desc}</div>
        ${data.cat !== 'output' ? '<div class="handle handle-right"></div>' : ''}
      `;
      
      container.appendChild(el);
      nodes[data.id] = { el, data };

      // Highlighting logic on hover
      el.addEventListener('mouseenter', () => highlightConnections(data.id, true));
      el.addEventListener('mouseleave', () => highlightConnections(data.id, false));

      let isDragging = false, startX, startY, initialX, initialY;
      
      el.addEventListener('mousedown', e => {
        e.stopPropagation(); 
        isDragging = true;
        startX = e.clientX / zoom; startY = e.clientY / zoom;
        initialX = parseInt(el.style.left, 10);
        initialY = parseInt(el.style.top, 10);
        el.style.zIndex = 200;
        document.body.style.cursor = 'grabbing';
      });

      window.addEventListener('mousemove', e => {
        if (!isDragging) return;
        const dx = (e.clientX / zoom) - startX;
        const dy = (e.clientY / zoom) - startY;
        el.style.left = (initialX + dx) + 'px';
        el.style.top = (initialY + dy) + 'px';
        drawEdges();
      });

      window.addEventListener('mouseup', () => {
        if(isDragging) {
          el.style.zIndex = 2;
          document.body.style.cursor = 'default';
        }
        isDragging = false;
      });
    });

    function highlightConnections(nodeId, isHovered) {
      svgPaths.forEach(p => {
        if (p.from === nodeId || p.to === nodeId) {
          p.path.setAttribute('stroke-width', isHovered ? (p.edge.width || 3) + 3 : (p.edge.width || 3));
          p.path.setAttribute('stroke', isHovered ? '#ffffff' : p.edge.color);
        } else {
          p.path.setAttribute('opacity', isHovered ? '0.2' : '1');
        }
      });
      // Dim other nodes
      Object.values(nodes).forEach(n => {
        if(isHovered && n.data.id !== nodeId && !edgesData.some(e => (e.from === nodeId && e.to === n.data.id) || (e.to === nodeId && e.from === n.data.id))) {
          n.el.style.opacity = '0.3';
        } else {
          n.el.style.opacity = '1';
        }
      });
    }

    function drawEdges() {
      canvas.innerHTML = ''; 
      svgPaths.length = 0;
      
      // Defs for glowing effects
      const defs = document.createElementNS("http://www.w3.org/2000/svg", "defs");
      defs.innerHTML = `
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="3" result="blur" />
          <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
      `;
      canvas.appendChild(defs);

      edgesData.forEach(edge => {
        if(!nodes[edge.from] || !nodes[edge.to]) return;
        const fromEl = nodes[edge.from].el;
        const toEl = nodes[edge.to].el;
        
        const x1 = parseInt(fromEl.style.left) + fromEl.offsetWidth;
        const y1 = parseInt(fromEl.style.top) + (fromEl.offsetHeight / 2);
        
        const x2 = parseInt(toEl.style.left);
        const y2 = parseInt(toEl.style.top) + (toEl.offsetHeight / 2);

        const cpOffset = Math.max(Math.abs(x2 - x1) / 2, 80);
        const d = `M ${x1} ${y1} C ${x1 + cpOffset} ${y1}, ${x2 - cpOffset} ${y2}, ${x2} ${y2}`;

        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("d", d);
        path.setAttribute("fill", "none");
        path.setAttribute("stroke", edge.color || "#475569");
        path.setAttribute("stroke-width", edge.width || "3");
        path.setAttribute("class", "path-line");
        path.setAttribute("stroke-linecap", "round");
        
        if (edge.animated) {
          path.setAttribute("stroke-dasharray", "8, 12");
          const animate = document.createElementNS("http://www.w3.org/2000/svg", "animate");
          animate.setAttribute("attributeName", "stroke-dashoffset");
          animate.setAttribute("values", "40;0");
          animate.setAttribute("dur", edge.width === 4 ? "0.8s" : "1.5s"); // Fast path is faster
          animate.setAttribute("repeatCount", "indefinite");
          path.appendChild(animate);
        }
        canvas.appendChild(path);
        svgPaths.push({ path, from: edge.from, to: edge.to, edge });
      });
    }

    // Panning & Zooming
    let zoom = 0.7;
    let panX = 100;
    let panY = 50;
    let isPanning = false;
    let panStartX, panStartY;

    function updateTransform() {
      container.style.transform = `translate(${panX}px, ${panY}px) scale(${zoom})`;
      container.style.transition = isPanning ? 'none' : 'transform 0.2s ease-out';
    }

    window.setZoom = (z) => {
      zoom = Math.max(0.2, Math.min(z, 2));
      updateTransform();
    };

    document.body.addEventListener('mousedown', e => {
      if(e.target === document.body || e.target === document.documentElement || e.target.id === 'canvas' || e.target.id === 'container') {
        isPanning = true;
        panStartX = e.clientX - panX;
        panStartY = e.clientY - panY;
        document.body.style.cursor = 'grabbing';
      }
    });

    window.addEventListener('mousemove', e => {
      if(isPanning) {
        panX = e.clientX - panStartX;
        panY = e.clientY - panStartY;
        updateTransform();
      }
    });

    window.addEventListener('mouseup', () => {
      isPanning = false;
      document.body.style.cursor = 'default';
    });

    document.addEventListener('wheel', e => {
      if(e.ctrlKey) {
        e.preventDefault();
        setZoom(zoom - e.deltaY * 0.001);
      } else {
        // Allow trackpad panning
        panX -= e.deltaX;
        panY -= e.deltaY;
        updateTransform();
      }
    }, { passive: false });

    // Init
    canvas.setAttribute('width', 3500);
    canvas.setAttribute('height', 2000);
    updateTransform();
    drawEdges();
  </script>
</body>
</html>
