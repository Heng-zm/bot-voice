[project]
name = "bot-voice"
version = "0.1.0"
description = "Telegram Bot Voice - Multilingual TTS & OCR Bot"
readme = { text = "Telegram Bot Voice - Multilingual TTS & OCR Bot", content-type = "text/plain" }
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot>=20.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "pydantic-settings>=2.0.0",
    "jinja2>=3.1.0",
    "itsdangerous>=2.1.0",
    "python-dotenv>=1.0.0",
    "supabase>=2.0.0",
    "edge-tts>=7.2.8,<8",

    "google-genai>=0.1.1",
    "huggingface_hub>=0.20.0",
    "gradio_client>=2,<3",
    "orjson>=3.9.0",
    "ujson>=5.9.0",
    "reportlab>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py311"
extend-exclude = ["app/legacy.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM", "ASYNC", "S"]
ignore = ["F822"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S102", "S105"]
